[project]
name = "spanner-reference"
version = "0.1.0"
description = "Minimal sqlalchemy-spanner + alembic setup"
authors = [
    {name = "Bu Sun Kim",email = "busun.kim@cdco.io"}
]
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "google-cloud-spanner (>=3.68.0,<4.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "sqlalchemy-spanner (>=1.19.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.1.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
